name: ETH asymmetric side-filter and cooldown sweep
on:
  push:
    paths:
      - '.github/workflows/eth-three-loop-refinement.yml'
      - 'research/asymmetric_side_filter_cooldown_sweep.py'
      - 'research/ema_9_21_123.py'
      - 'research/run_factory.py'
      - 'app/engine.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eth-three-loop-refinement
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run asymmetric long-short filter/cooldown sweep on ETHUSDT
        run: python -m compileall -q app research && PYTHONPATH=. python research/asymmetric_side_filter_cooldown_sweep.py
      - name: Upload asymmetric sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asymmetric-side-filter-cooldown-report
          path: research-results/asymmetric_side_filter_cooldown_sweep.json
          if-no-files-found: warn
          retention-days: 90
