name: ETH 11-loss real-cost break-even test
on:
  push:
    paths:
      - '.github/workflows/11-loss-eth-real-cost-break-even.yml'
      - 'research/11_loss_eth_real_cost_break_even.py'
      - 'research/ema_9_21_123.py'
      - 'research/run_factory.py'
      - 'app/engine.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eth-11-loss-real-cost-break-even
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run real-cost break-even comparison
        run: python -m compileall -q app research && PYTHONPATH=. python research/11_loss_eth_real_cost_break_even.py
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 11-loss-eth-real-cost-break-even-results
          path: research-results/11_loss_eth_real_cost_break_even_report.json
          if-no-files-found: warn
          retention-days: 90
