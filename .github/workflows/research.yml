name: ETHUSDT Strategy Factory research v0.9.9 optimized checkpointed batches
on:
  push:
    paths:
      - ".github/workflows/research.yml"
      - "app/engine.py"
      - "research/run_factory.py"
      - "tests/test_search.py"
      - "tests/test_engine.py"
      - "tests/test_capability_gate.py"
  workflow_dispatch:
    inputs:
      candidates:
        description: "Unique candidate count"
        required: false
        default: "500000"
      runtime_seconds:
        description: "Maximum research search time in seconds"
        required: false
        default: "19500"
permissions:
  contents: write
concurrency:
  group: ethusdt-strategy-factory-research-v098-bounded15m
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Staged screening lane: [screening-research] runs a bounded fast stratified screen, then reports audited near-misses without relaxing any acceptance criteria.
      # retains the 500k / 5h25m defaults and exposes a runtime override.
      # Audited full-research launch requested by project owner; tests run before data/search.
      # Benchmark parity is checked in the research runner.
      # Latest smoke includes standalone-template parity tests for all 40 families.
      # UI family controls are checked against the engine family registry by tests.
      # app.js family labels and displayed counts are included in the same regression suite.
      # Canonical smoke source is pinned to the triggering commit SHA.
      # FULL 500K RUN AUTHORIZED BY OWNER: execute all gates, then full search; preserve results even on failure.
      # The research runner emits SEARCH_HEARTBEAT every 25 unique candidate evaluations
      # so operators can see continuous progress instead of waiting for a whole batch.
      FOUNDRY_CANDIDATES: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[screening-research]') && '10000' || github.event_name == 'push' && contains(github.event.head_commit.message, '[15m-research]') && '500000' || github.event_name == 'push' && contains(github.event.head_commit.message, '[full-research]') && '500000' || github.event_name == 'push' && '1000' || github.event.inputs.candidates || '500000' }}
      FOUNDRY_SEED: "20261022"
      # The fast lane uses a 10-minute discovery budget plus data checks and independent validation; all families and validation gates remain enabled.
      # Joint-score update: explicit capital-exhaustion rejection and activity/TP-day-weighted near-miss ranking; original acceptance thresholds unchanged.
      # [15m-research] Keep the agreed >=8 trades/day activity evidence gate; no unapproved monthly trade quota.
      # Activity gate is daily-rate-only; monthly trade counts are diagnostics, never a hidden acceptance quota.
      # [15m-research] sparse 1-second Binance kline windows are accepted only as returned trade-backed rows; no synthetic candles.
      # Empty execution windows inside an ambiguous 1m candle remain a hard integrity failure.
      # [15m-research] Primary and independent resolvers share sparse 1s acceptance and fail-closed empty-window behavior.
      # [15m-research] Final batch size adapts to measured throughput; report audited near-misses even when no candidate meets all gates.

      # Screening now uses the existing bounded parallel stratified evaluator; all acceptance and audit gates remain unchanged.
      FOUNDRY_ALGORITHM: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[screening-research]') && 'stratified_random' || 'surrogate_genetic' }}
      FOUNDRY_MAX_RUNTIME_SECONDS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[screening-research]') && '720' || github.event_name == 'push' && contains(github.event.head_commit.message, '[15m-research]') && '600' || github.event_name == 'push' && contains(github.event.head_commit.message, '[full-research]') && '19500' || github.event_name == 'push' && '600' || github.event.inputs.runtime_seconds || '19500' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install declared dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests before expensive research
        run: python -m pytest -q
      - name: Compile and run the real-data factory
        run: |
          python -m compileall -q app research
          python research/run_factory.py
      - name: Upload raw-data and audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-foundry-research-${{ github.run_id }}
          path: |
            research-results/progress.json
            research-results/report.json
            research-results/validated_strategies.zip
            research-run/ETHUSDT-1m-202604-202609.csv.gz
          if-no-files-found: warn
          retention-days: 90
      - name: Commit auditable results to main
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-research]')))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add research-results/progress.json
          if [ -f research-results/report.json ]; then git add research-results/report.json; fi
          if [ -f research-results/validated_strategies.zip ]; then git add research-results/validated_strategies.zip; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record ETHUSDT Strategy Factory research results"
            git push origin HEAD:main
          fi
