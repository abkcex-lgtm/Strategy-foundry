
name: ETHUSDT Strategy Factory research v0.9.9 optimized checkpointed batches
# Full audited run re-triggered after fixing the shared market-data manifest test assertion.
on:
  push:
    paths:
      - ".github/workflows/research.yml"
  workflow_dispatch:
    inputs:
      candidates:
        description: "Unique candidate count"
        required: false
        default: "500000"
      runtime_seconds:
        description: "Maximum research search time in seconds"
        required: false
        default: "19500"
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            seed: 42
          - shard: 1
            seed: 1042
          - shard: 2
            seed: 2042
          - shard: 3
            seed: 3042
    timeout-minutes: 360
    env:
      # Pushes normally run a bounded real-data smoke test. A commit message containing
      # [full-research] intentionally launches the full 500k search. Manual dispatch
      # retains the 500k / 5h25m defaults and exposes a runtime override.
      # Audited full-research launch requested by project owner; tests run before data/search.
      # Benchmark parity is checked in the research runner.
      # Latest smoke includes standalone-template parity tests for all 40 families.
      # UI family controls are checked against the engine family registry by tests.
      # app.js family labels and displayed counts are included in the same regression suite.
      # Canonical smoke source is pinned to the triggering commit SHA.
      # FULL 500K RUN AUTHORIZED BY OWNER: execute all gates, then full search; preserve results even on failure.
      # Parallel shard workers are globally deduplicated and aggregated before a result is certified.
      # The research runner emits SEARCH_HEARTBEAT every 25 unique candidate evaluations
      # so operators can see continuous progress instead of waiting for a whole batch.
      FOUNDRY_CANDIDATES: ${{ ((github.event_name == 'push' && contains(github.event.head_commit.message, '[full-research]')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.candidates == '500000' || github.event.inputs.candidates == ''))) && '135000' || github.event_name == 'push' && '1000' || github.event.inputs.candidates || '500000' }}
      FOUNDRY_SEED: ${{ matrix.seed }}
      FOUNDRY_ALGORITHM: "surrogate_genetic"
      FOUNDRY_MAX_RUNTIME_SECONDS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[full-research]') && '19500' || github.event_name == 'push' && '600' || github.event.inputs.runtime_seconds || '19500' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install declared dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests before expensive research
        run: python -m pytest -q
      - name: Compile and run the real-data factory
        run: |
          python -m compileall -q app research
          python research/run_factory.py
      - name: Upload raw-data and audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-foundry-research-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            research-results/progress.json
            research-results/report.json
            research-results/validated_strategies.zip
            research-results/evaluated_genome_hashes.txt.gz
            research-run/ETHUSDT-1m-202604-202609.csv.gz
          if-no-files-found: warn
          retention-days: 90
undefined
  aggregate:
    needs: research
    if: always() && needs.research.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Download every research shard artifact
        uses: actions/download-artifact@v4
        with:
          pattern: strategy-foundry-research-${{ github.run_id }}-shard-*
          path: research-artifacts
          merge-multiple: false
      - name: Aggregate globally unique genomes and audited candidates
        run: python research/aggregate_shards.py
      - name: Upload combined audit result
        uses: actions/upload-artifact@v4
        with:
          name: strategy-foundry-aggregate-${{ github.run_id }}
          path: |
            research-results/report.json
            research-results/progress.json
            research-results/validated_strategies.zip
            research-results/evaluated_genome_hashes.txt.gz
          if-no-files-found: error
          retention-days: 90
      - name: Commit auditable combined result
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-research]')))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-results/progress.json research-results/report.json research-results/validated_strategies.zip
          if ! git diff --cached --quiet; then
            git commit -m "Record globally deduplicated Strategy Foundry research result"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
