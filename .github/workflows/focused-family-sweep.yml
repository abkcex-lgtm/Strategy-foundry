name: Focused mean-reversion and failed-breakout sweep
on:
  push:
    paths:
      - "research/focused_family_sweep.py"
      - ".github/workflows/focused-family-sweep.yml"
      - "research/run_factory.py"
      - "app/engine.py"
      - "app/audit.py"
      - "app/data.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-family-sweep
  cancel-in-progress: true
jobs:
  focused-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run focused real-data family sweep
        run: python -m compileall -q app research && PYTHONPATH=. python research/focused_family_sweep.py
      - name: Upload focused family report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-family-results
          path: research-results/focused_family_report.json
          if-no-files-found: warn
          retention-days: 90
