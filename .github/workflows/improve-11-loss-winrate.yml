name: Improve 11-loss candidate win rate
on:
  push:
    paths:
      - "research/optimize_11_loss_candidate.py"
      - "research/improve_11_loss_winrate.py"
      - ".github/workflows/improve-11-loss-winrate.yml"
      - "research/ema_9_21_123.py"
      - "research/run_factory.py"
      - "app/engine.py"
      - "app/data.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: improve-11-loss-winrate
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Sweep entries, filters, and stops on real Binance data
        run: python -m compileall -q app research && PYTHONPATH=. python research/optimize_11_loss_candidate.py
      - name: Upload optimization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimize-11-loss-results
          path: research-results/optimize_11_loss_report.json
          if-no-files-found: warn
          retention-days: 90
