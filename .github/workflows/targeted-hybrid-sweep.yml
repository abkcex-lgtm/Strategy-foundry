name: Targeted hybrid structure and regime sweep
on:
  push:
    paths:
      - "research/targeted_hybrid_sweep.py"
      - ".github/workflows/targeted-hybrid-sweep.yml"
      - "research/run_factory.py"
      - "app/engine.py"
      - "app/audit.py"
      - "app/data.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: targeted-hybrid-sweep
  cancel-in-progress: true
jobs:
  hybrid-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run targeted hybrid search
        run: python -m compileall -q app research && PYTHONPATH=. python research/targeted_hybrid_sweep.py
      - name: Upload targeted hybrid report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-hybrid-results
          path: research-results/targeted_hybrid_report.json
          if-no-files-found: warn
          retention-days: 90
