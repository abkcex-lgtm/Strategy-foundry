name: ETH same-config trade-count diagnostic
on:
  push:
    paths:
      - '.github/workflows/eth-same-config-diagnostic.yml'
      - 'research/diagnose_split_trade_count.py'
      - 'research/ema_9_21_123.py'
      - 'research/run_factory.py'
      - 'app/engine.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eth-same-config-diagnostic
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run identical configurations on Train and Development
        run: python -m compileall -q app research && PYTHONPATH=. python research/diagnose_split_trade_count.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: same-config-trade-count-diagnostic
          path: research-results/same_config_trade_count_diagnostic.json
          if-no-files-found: warn
          retention-days: 90
