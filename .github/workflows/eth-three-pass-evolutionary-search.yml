name: ETH three-pass evolutionary strategy search
on:
  push:
    paths:
      - '.github/workflows/eth-three-pass-evolutionary-search.yml'
      - 'research/eth_three_pass_evolutionary_search.py'
      - 'research/run_factory.py'
      - 'app/engine.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eth-three-pass-evolutionary-search
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run three-pass search and development retests
        env:
          FOUNDRY_WORKERS: '8'
        run: python -m compileall -q app research && PYTHONPATH=. python research/eth_three_pass_evolutionary_search.py
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-three-pass-evolutionary-search-report
          path: research-results/eth_three_pass_evolutionary_search_report.json
          if-no-files-found: warn
          retention-days: 90
