name: EMA 12/21 band-pullback comparison
on:
  push:
    paths:
      - "research/ema12_21_band_pullback.py"
      - ".github/workflows/ema12-21-band-pullback.yml"
      - "research/ema_9_21_123.py"
      - "research/run_factory.py"
      - "app/engine.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ema12-21-band-pullback-comparison
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Train/Development comparison on real Binance candles
        run: python -m compileall -q app research && python research/ema12_21_band_pullback.py
      - name: Upload EMA 12/21 comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema12-21-band-pullback-report
          path: research-results/ema12_21_band_pullback_report.json
          if-no-files-found: warn
          retention-days: 90
